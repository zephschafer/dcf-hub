name: stripe_customers
namespace: stripe
description: Customers from Stripe, fetched via the Stripe REST API using date-range iteration.

source:
  type: http
  url: https://api.stripe.com/v1/customers
  method: GET
  auth:
    type: bearer
    value: "{{ env.STRIPE_SECRET_KEY }}"
  params:
    - name: "created[gte]"
      type: string
      value: ~
    - name: "created[lt]"
      type: string
      value: ~
    - name: limit
      type: integer
      value: 100
  response:
    format: json
    records_path: data
  schema:
    columns:
      - name: id
        path: id
        type: string
      - name: email
        path: email
        type: string
      - name: name
        path: name
        type: string
      - name: created
        path: created
        type: integer
      - name: currency
        path: currency
        type: string
      - name: description
        path: description
        type: string
      - name: phone
        path: phone
        type: string
      - name: delinquent
        path: delinquent
        type: boolean

cadence:
  strategy: incremental
  primary_key: id
  iterate:
    - type: date_range
      params: ["created[gte]", "created[lt]"]
      format: "%s"
      start: "2024-01-01"
      end: today
      step: 30 days
