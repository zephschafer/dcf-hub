name: jira_projects
namespace: jira
description: Projects from Jira Cloud via the REST API v3.

source:
  type: http
  url: "https://{{ env.JIRA_DOMAIN }}/rest/api/3/project"
  method: GET
  auth:
    type: header
    key: Authorization
    value: "Basic {{ env.JIRA_BASIC_AUTH }}"
  params:
    - name: maxResults
      type: integer
      value: 200
  response:
    format: json
    records_path: values
  schema:
    columns:
      - name: id
        path: id
        type: string
      - name: key
        path: key
        type: string
      - name: name
        path: name
        type: string
      - name: project_type_key
        path: projectTypeKey
        type: string
      - name: style
        path: style
        type: string

cadence:
  strategy: full_refresh
