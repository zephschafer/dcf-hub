name: github_commits
namespace: github
description: Commits to a GitHub repository. Set GITHUB_OWNER and GITHUB_REPO to target any repo. Unauthenticated requests are limited to 60/hr — set GITHUB_TOKEN to raise that to 5,000/hr.

source:
  type: http
  url: "https://api.github.com/repos/{{ env.GITHUB_OWNER }}/{{ env.GITHUB_REPO }}/commits"
  method: GET
  auth:
    type: bearer
    value: "{{ env.GITHUB_TOKEN }}"
  params:
    - name: per_page
      type: integer
      value: 100
    - name: since
      type: string
      value: ~
    - name: until
      type: string
      value: ~
  response:
    format: json
  rate_limit:
    requests: 60
    per_minutes: 60
  schema:
    columns:
      - {name: sha,          path: sha,                   type: string}
      - {name: author,       path: commit.author.name,    type: string}
      - {name: email,        path: commit.author.email,   type: string}
      - {name: message,      path: commit.message,        type: string}
      - {name: committed_at, path: commit.author.date,    type: timestamp}
      - {name: url,          path: html_url,              type: string}

cadence:
  strategy: incremental
  primary_key: sha
  iterate:
    - type: date_range
      params: [since, until]
      format: "%Y-%m-%dT%H:%M:%SZ"
      start: "2024-01-01"
      end: today
      step: 30 days

deployment:
  schedule: "0 8 * * *"
