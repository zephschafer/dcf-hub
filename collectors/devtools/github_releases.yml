name: github_releases
namespace: github
description: Releases from a GitHub repository. Set GITHUB_OWNER and GITHUB_REPO to target any repo.

source:
  type: http
  url: "https://api.github.com/repos/{{ env.GITHUB_OWNER }}/{{ env.GITHUB_REPO }}/releases"
  method: GET
  auth:
    type: bearer
    value: "{{ env.GITHUB_TOKEN }}"
  params:
    - name: per_page
      type: integer
      value: 100
  response:
    format: json
  rate_limit:
    requests: 60
    per_minutes: 60
  schema:
    columns:
      - {name: id,            path: id,               type: integer}
      - {name: tag_name,      path: tag_name,         type: string}
      - {name: name,          path: name,             type: string}
      - {name: draft,         path: draft,            type: boolean}
      - {name: prerelease,    path: prerelease,       type: boolean}
      - {name: author,        path: author.login,     type: string}
      - {name: created_at,    path: created_at,       type: timestamp}
      - {name: published_at,  path: published_at,     type: timestamp}
      - {name: url,           path: html_url,         type: string}

cadence:
  strategy: incremental
  primary_key: id

deployment:
  schedule: "0 8 * * *"
