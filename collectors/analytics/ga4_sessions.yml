name: ga4_sessions
namespace: google_analytics
description: Sessions and engagement metrics from Google Analytics 4 via the GA4 Data API. Requires pip install dcf-google-analytics and a GOOGLE_APPLICATION_CREDENTIALS service account key file.

source:
  type: python
  module: dcf_google_analytics
  function: fetch_sessions
  params:
    - name: property_id
      type: string
      value: "{{ env.GA4_PROPERTY_ID }}"
    - name: start_date
      type: string
      value: ~
    - name: end_date
      type: string
      value: ~
  schema:
    columns:
      - name: date
        path: date
        type: string
      - name: session_source
        path: sessionSource
        type: string
      - name: session_medium
        path: sessionMedium
        type: string
      - name: sessions
        path: sessions
        type: integer
      - name: active_users
        path: activeUsers
        type: integer
      - name: bounce_rate
        path: bounceRate
        type: float
      - name: avg_session_duration
        path: averageSessionDuration
        type: float

cadence:
  strategy: incremental
  primary_key: date
  iterate:
    - type: date_range
      params: [start_date, end_date]
      start: "2024-01-01"
      end: today
      step: 30 days
